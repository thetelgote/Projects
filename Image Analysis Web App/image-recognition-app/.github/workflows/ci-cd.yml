name: Node.js CI - AWS Rekognition App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 📦 Install dependencies
      run: npm install

    - name: ✅ Lint (optional)
      run: |
        npm install eslint --save-dev
        npx eslint . || true

    - name: 🧪 Run tests
      run: |
        npm test || echo "No tests available"
